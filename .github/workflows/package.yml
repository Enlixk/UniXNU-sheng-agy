name: package

# scripts/package.sh of this repository on a macOS runner, with the UniXNU and uefi-sheng
# checkouts beside it, the layout board.toml names. The platform seed comes from the
# repository secret UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the run's
# artifacts belong to one device alone: download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Create a NEW installation seed if no saved seed exists (iPadOS 27 only)"
        type: boolean
        default: false
      data_seed_url:
        description: "Optional original data.dbr URL for an existing installation; otherwise use the saved cache"
        type: string
      data_seed_sha256:
        description: "Required SHA-256 when data_seed_url is supplied"
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  UNIXNU_REF: 13e5973748a8447cbb90520c9a2dd5e65e272435 # Last UniXNU commit with all submodules pushed to GitHub

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ env.UNIXNU_REF }}
          path: UniXNU
          submodules: recursive
      - name: apply upstream launchd cache truncation and keystore/prelink fixes
        run: |
          git -C UniXNU/drivers/AppleKeyStoreState fetch --depth=1 origin 8c70daf814aafdf4a3d35e40dde0322655fd0a83
          git -C UniXNU/drivers/AppleKeyStoreState checkout --detach 8c70daf814aafdf4a3d35e40dde0322655fd0a83
          git -C UniXNU/kits/XnuPrelink fetch --depth=1 origin ef4fe4f9ec59faa04eba24025bac0fa2985dbe5b
          git -C UniXNU/kits/XnuPrelink checkout --detach ef4fe4f9ec59faa04eba24025bac0fa2985dbe5b
          python3 - <<'PY'
          import pathlib
          for rel in ('patches/xnu-12377/zzy-native-gpu-addon-mount.patch', 'patches/xnu/zzy-native-gpu-addon-mount.patch'):
              p = pathlib.Path('UniXNU') / rel
              t = p.read_text()
              t = t.replace(',321 @@ uint64_t native_owner_data_seed_base', ',323 @@ uint64_t native_owner_data_seed_base', 1)
              old_attr = '+\t\tVATTR_SET(&va, va_mode, mode);\n+\t\terror = vnode_setattr(vp, &va, ctx);'
              new_attr = '+\t\tVATTR_SET(&va, va_mode, mode);\n+\t\t/* Kernel vnode_open does not finish O_TRUNC on the non-compound path. */\n+\t\tVATTR_SET(&va, va_data_size, size);\n+\t\terror = vnode_setattr(vp, &va, ctx);'
              assert old_attr in t, f'missing target in {rel}'
              p.write_text(t.replace(old_attr, new_attr, 1))
              print(f'patched {rel} with va_data_size truncation fix')
          comp = pathlib.Path('UniXNU/components.toml')
          ct = comp.read_text()
          for old_rev, new_rev in [
              ('42ff83e08b2265fe741d4adaf084bebe003452ba', '8c70daf814aafdf4a3d35e40dde0322655fd0a83'),
              ('b74ed7c74a07f0eb5f81089c660905ecc4cabb7f', 'ef4fe4f9ec59faa04eba24025bac0fa2985dbe5b'),
              ('f6bf561f92cc42761bdd417fce1d53fe1db9477c', '28de7b91d7a880682b777e0e3564245a99dbc3f5'),
          ]:
              assert old_rev in ct, f'missing {old_rev} in components.toml'
              ct = ct.replace(old_rev, new_rev, 1)
          comp.write_text(ct)
          print('updated components.toml revisions')
          p = pathlib.Path('UniXNU/patches/mesa/turnip-frame-diagnostics.patch')
          t = p.read_text()
          head = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n'
          old = head + '--- /dev/null\n'
          new = head + 'new file mode 100644\n--- /dev/null\n'
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print('patched missing new file mode header')
          else:
              print('header already valid, nothing to do')
          PY
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/uefi-sheng
          path: uefi-sheng
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/llvm/bin"
            echo "/opt/homebrew/opt/lld/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          # Fail fast, naming the tool, before forty minutes of build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: seed cache identity
        id: seed-key
        env:
          SEED: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('key=data-seed-v1-' + hashlib.sha256(os.environ['SEED'].encode()).hexdigest()[:16] + '\n')
          PY
      - uses: actions/cache/restore@v4
        id: data-cache
        if: inputs.os == '27'
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: prepare preserved Data seed
        if: inputs.os == '27'
        env:
          INIT_DATA: ${{ inputs.init_data }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request
          inputs = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())['inputs']
          path = pathlib.Path('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr')
          url, digest = inputs.get('data_seed_url', ''), inputs.get('data_seed_sha256', '').lower()
          if url:
              print('::add-mask::' + url)
              if not url.startswith('https://') or len(digest) != 64 or any(c not in '0123456789abcdef' for c in digest):
                  raise SystemExit('A seed URL requires HTTPS and its SHA-256')
              with urllib.request.urlopen(url, timeout=120) as source:
                  data = source.read(64 * 1024 * 1024 + 1)
              if len(data) > 64 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit('Seed size or SHA-256 mismatch')
              if path.exists() and path.read_bytes() != data:
                  raise SystemExit('Saved seed differs; preserve and inspect it instead of replacing this installation')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
          if not path.is_file() and os.environ['INIT_DATA'] != 'true':
              raise SystemExit('No saved seed. Supply the ORIGINAL seed for an existing installation, or select init_data for a FIRST installation')
          PY
      - name: restore GPU build intermediates
        id: gpu-cache
        if: inputs.os == '27'
        uses: actions/cache/restore@v4
        with:
          path: |
            UniXNU/.cache/mesa-work
            UniXNU/.cache/mesa-venv
            UniXNU/.cache/gpu-reference/metal2vulkan
            UniXNU/build/mesa-tu-ios27
            UniXNU/build/adreno-metal-bridge
            UniXNU/build/m2v-target
            device/drivers/Ath12kWifi/deps
          key: gpu-build-v3-${{ inputs.os }}-${{ hashFiles('UniXNU/scripts/data/adreno-compiler-inputs.json', 'UniXNU/scripts/data/gpu-metal-vulkan-inputs.json', 'UniXNU/patches/mesa/**', 'UniXNU/drivers/AdrenoMetal/bridge/patches/**', 'device/drivers/Ath12kWifi/tools/source-lock.json') }}
      - name: prepare WCN7850 firmware and Ath12kWifi sources
        if: inputs.os == '27'
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          fw_dir = pathlib.Path('device/firmware/wcn7850')
          manifest = json.loads((fw_dir / 'manifest.json').read_text())['files']
          base_url = 'https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/ath12k/WCN7850/hw2.0/'
          for name, expected in manifest.items():
              dest = fw_dir / name
              if not dest.is_file() or hashlib.sha256(dest.read_bytes()).hexdigest() != expected['sha256']:
                  print(f'Downloading {name}...')
                  with urllib.request.urlopen(base_url + name, timeout=120) as resp:
                      data = resp.read()
                  if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                      raise SystemExit(f'{name} size or SHA-256 mismatch')
                  dest.write_bytes(data)
              print(f'Verified {name}: {expected["bytes"]} bytes, sha256={expected["sha256"]}')
          # Git 2.48+ defaults sparse checkouts to cone mode, which refuses the file patterns of the source lock.
          fs = pathlib.Path('device/drivers/Ath12kWifi/tools/fetch-sources.py')
          text = fs.read_text()
          old = '"sparse-checkout", "add"'
          if old in text:
              fs.write_text(text.replace(old, '"sparse-checkout", "set", "--no-cone"', 1))
              print('patched fetch-sources.py for non-cone sparse checkout')
          PY
          bash device/drivers/Ath12kWifi/tools/fetch-sources.sh
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          INIT_DATA: ${{ inputs.init_data }}
          OS_PROFILE: ${{ inputs.os }}
        run: |
          args=(--os "$OS_PROFILE" --uefi ../uefi-sheng)
          if [ "$OS_PROFILE" = 27 ] && [ "$INIT_DATA" = true ]; then
            args+=(--init-data)
          fi
          scripts/package.sh "${args[@]}"
      - name: save GPU build intermediates
        if: always() && inputs.os == '27' && steps.gpu-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/build/mesa-tu-ios27/src/freedreno/vulkan/libvulkan_freedreno.dylib') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            UniXNU/.cache/mesa-work
            UniXNU/.cache/mesa-venv
            UniXNU/.cache/gpu-reference/metal2vulkan
            UniXNU/build/mesa-tu-ios27
            UniXNU/build/adreno-metal-bridge
            UniXNU/build/m2v-target
            device/drivers/Ath12kWifi/deps
          key: gpu-build-v3-${{ inputs.os }}-${{ hashFiles('UniXNU/scripts/data/adreno-compiler-inputs.json', 'UniXNU/scripts/data/gpu-metal-vulkan-inputs.json', 'UniXNU/patches/mesa/**', 'UniXNU/drivers/AdrenoMetal/bridge/patches/**', 'device/drivers/Ath12kWifi/tools/source-lock.json') }}
      - uses: actions/cache/save@v4
        if: always() && inputs.os == '27' && steps.data-cache.outputs.cache-hit != 'true' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        with:
          path: |
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr
            UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/inputs.json
          key: ${{ steps.seed-key.outputs.key }}-${{ inputs.os }}
      - name: installation seed backup
        if: always() && inputs.os == '27' && hashFiles('UniXNU/out/sheng/ipados-27.0.1-24A446/sheng_ipados27/runtime/data.dbr') != ''
        uses: actions/upload-artifact@v4
        with:
          name: installation-seed-${{ inputs.os }}
          retention-days: 3
          path: |
            UniXNU/out/sheng/*/*/runtime/data.dbr
            UniXNU/out/sheng/*/*/runtime/inputs.json
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 3
          if-no-files-found: error
          path: |
            UniXNU/out/sheng/*/*/boot/boot.img
            UniXNU/out/sheng/*/*/payload/payload.img
            UniXNU/out/sheng/*/*/kernel/kernel.macho
            UniXNU/out/sheng/*/*/package.manifest.json
